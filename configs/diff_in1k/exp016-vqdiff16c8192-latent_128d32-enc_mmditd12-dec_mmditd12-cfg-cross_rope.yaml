results_dir: ./experiments/in1k
cloud_save_path: ./experiments/in1k
compile: True
global_seed: 42
log_every: 50
vis_every: 2500
ckpt_every: 20000
mixed_precision: bf16
no_local_save: True
vq_ckpt: /mnt/blob/haoc/rule_tokenizer/expriments/exp008-aediff16-latent_128d32-enc_mmditd12-dec_mmditd12-cfg-cross_rope/checkpoints/0240000.pt
finetune: True

dataset: imagenet
data_path: /tmp/imagenet/train
val_data_path: ../imagenet/val
image_size: 256

vq_model: VQ-Diff-16
ema: True 
num_latent_tokens: 128
codebook_embed_dim: 32
codebook_size: 8192
commit_loss_beta: 0.0
entropy_loss_ratio: 0.01
codebook_l2_norm: True
perceptual_loss_weight: 0.1

freeze_encoder: True
latent_pos_embed_type: cross_rope
enc_type: mmdit
encoder_model: mmdit_d12 # vit_base_patch14_dinov2.lvd142m
encoder_pretrained: False
encoder_patch_size: 8
encoder_tuning_method: full
dec_type: mmdit
decoder_model: mmdit_d12
decoder_pretrained: False 
decoder_patch_size: 8
decoder_tuning_method: full
using_cfg: True
cfg_scale: 1.5

epochs: 100
lr: 5.0e-5
lr_warmup_epochs: 0
optim: adamw
lr_scheduler: cosine
weight_decay: 0.0
beta1: 0.9
beta2: 0.95
max_grad_norm: 1.0
global_batch_size: 1024



